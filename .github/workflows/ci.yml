name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / ${{ matrix.runtime }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        runtime: [node, bun]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: npm ci --ignore-scripts
      - run: npm run check
      - if: matrix.runtime == 'node'
        run: npm test
      - if: matrix.runtime == 'bun'
        run: npm run test:bun
      - run: node packages/lab-skills/bin/lab-skills.mjs validate --json
